ansible_python_interpreter: /usr/local/bin/python3.11

wan_interface: vtnet0
trunk_interface: vtnet1

lan_vlan: 110
dmz_vlan: 120
admin_vlan: 130

lan_ip: 192.168.110.1
dmz_ip: 192.168.120.1
admin_ip: 192.168.130.1

bastion_ip: 192.168.120.10
webserver_ip: 192.168.110.100

# NAT ports WAN → VMs internes
bastion_nat_port: "2231"
webserver_nat_port: "2232"

# IPs externes autorisees
epitetch_network_ip: "163.5.3.84"
samy_network_ip: "90.49.150.217"
anais_network_ip: "176.159.255.103"
jaures_network_ip: "94.238.238.44"
anthony_network_ip: "88.187.108.38"

# IPs autorisees a joindre les VMs internes en SSH (source du NAT/regles)
vm_ssh_allowed_ips:
  - "{{ epitetch_network_ip }}"
  - "{{ samy_network_ip }}"
  - "{{ anais_network_ip }}"
  - "{{ jaures_network_ip }}"
  - "{{ anthony_network_ip }}"

# VPN Site-a-Site
site1_wan_ip: "5.196.51.228"
vpn_port: 1194
vpn_tunnel_network: "10.0.0.0/30"
vpn_site1_lan: "192.168.10.0/24"
vpn_site1_admin: "192.168.30.0/24"

# ============================================================
# DNS (Unbound) — zone interne Site 2 + resolution croisee vers Site 1
# ============================================================
dns_zone: "site2.lan"

dns_hosts:
  - { host: "bastion",    ip: "{{ bastion_ip }}",   descr: "Bastion Host" }
  - { host: "webserver",  ip: "{{ webserver_ip }}", descr: "WebServer" }
  - { host: "dashboards", ip: "{{ webserver_ip }}", descr: "OpenSearch Dashboards" }
  - { host: "fw",         ip: "{{ lan_ip }}",       descr: "pfSense Site 2" }

dns_domainoverrides:
  - { domain: "site1.lan", ip: "192.168.10.1", descr: "Resolution croisee vers Site 1 (via VPN)" }

# VLANs internes autorises a interroger le DNS du pfSense
dns_client_interfaces:
  - "LAN"
  - "DMZ"
  - "ADMIN"

# Kill switch : garder l'entree bastion joignable pendant l'isolation (recovery)
killswitch_bastion_exception: true