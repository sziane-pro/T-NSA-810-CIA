[defaults]
roles_path = roles
inventory = inventories/site1
action_warnings = false
# Mot de passe ansible-vault (group_vars chiffres).
# Place dans le home WSL (les permissions Linux ne marchent pas sur /mnt/c).
# A creer localement, JAMAIS commite : echo "MON_MDP_VAULT" > ~/.vault_pass && chmod 600 ~/.vault_pass
vault_password_file = ~/.vault_pass

[connection]
pipelining = true