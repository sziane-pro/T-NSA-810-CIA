# ============================================================
# NAT Port Forward — WAN → VMs internes
# Port 2233 → Bastion SSH (22)
# Port 2234 → WebServer SSH (22)
# ============================================================

- name: NAT port forward 2233 to Bastion SSH
  pfsensible.core.pfsense_nat_port_forward:
    descr: "NAT SSH Bastion (2233)"
    interface: WAN
    protocol: tcp
    source: any
    destination: "(self):{{ bastion_nat_port }}"
    target: "{{ bastion_ip }}:22"
    state: present

- name: NAT port forward 2234 to WebServer SSH
  pfsensible.core.pfsense_nat_port_forward:
    descr: "NAT SSH WebServer (2234)"
    interface: WAN
    protocol: tcp
    source: any
    destination: "(self):{{ webserver_nat_port }}"
    target: "{{ webserver_ip }}:22"
    state: present
