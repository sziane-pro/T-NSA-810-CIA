# ============================================================
# Import PKI client dans pfSense-S2
# La PKI est lue depuis Vault (source de verite, generee par le
# role pki sur admin_vm). Le lookup s'execute sur le controller :
# VAULT_ADDR/VAULT_TOKEN dans l'env + tunnel Vault (gere par le Makefile).
# ============================================================

- name: Load PKI material from Vault
  ansible.builtin.set_fact:
    vault_ca_crt: "{{ lookup('community.hashi_vault.hashi_vault', 'secret/data/pki:ca_crt', url=lookup('env', 'VAULT_ADDR'), token=lookup('env', 'VAULT_TOKEN'), validate_certs=false) }}"
    vault_client_crt: "{{ lookup('community.hashi_vault.hashi_vault', 'secret/data/pki:vpn_client_site2_crt', url=lookup('env', 'VAULT_ADDR'), token=lookup('env', 'VAULT_TOKEN'), validate_certs=false) }}"
    vault_client_key: "{{ lookup('community.hashi_vault.hashi_vault', 'secret/data/pki:vpn_client_site2_key', url=lookup('env', 'VAULT_ADDR'), token=lookup('env', 'VAULT_TOKEN'), validate_certs=false) }}"
  no_log: true

- name: Import CA into pfSense S2
  pfsensible.core.pfsense_ca:
    name: "VPN-CA"
    method: existing
    certificate: "{{ vault_ca_crt | b64encode }}"
    state: present

- name: Import client certificate into pfSense S2
  pfsensible.core.pfsense_cert:
    name: "vpn-client-site2"
    ca: "VPN-CA"
    method: import
    certificate: "{{ vault_client_crt | b64encode }}"
    key: "{{ vault_client_key | b64encode }}"
    state: present

# ============================================================
# Configuration client OpenVPN vers Site 1
# ============================================================

- name: Configure OpenVPN client Site 2
  pfsensible.core.pfsense_openvpn_client:
    name: "VPN-Site2"
    mode: "p2p_tls"
    interface: "WAN"
    protocol: "UDP4"
    server_addr: "{{ site1_wan_ip }}"
    server_port: "{{ vpn_port }}"
    tunnel_network: "{{ vpn_tunnel_network }}"
    remote_network: "{{ vpn_site1_lan }},{{ vpn_site1_admin }}"
    ca: "VPN-CA"
    cert: "vpn-client-site2"
    data_ciphers: "AES-256-GCM"
    data_ciphers_fallback: "AES-256-GCM"
    # Compression desactivee (doit etre identique cote serveur Site 1)
    # "" = Omit Preference ; evite le mismatch LZO ("Bad LZO decompression header")
    compression: ""
    state: present

# ============================================================
# Règles firewall VPN — trafic entrant depuis Site 1
# ============================================================

- name: Allow traffic from Site 1 LAN via VPN tunnel
  pfsensible.core.pfsense_rule:
    name: "VPN Site1 LAN to Site2"
    action: pass
    interface: openvpn
    ipprotocol: inet
    protocol: any
    source: "{{ vpn_site1_lan }}"
    destination: any
    state: present

- name: Allow traffic from Site 1 Admin via VPN tunnel
  pfsensible.core.pfsense_rule:
    name: "VPN Site1 Admin to Site2"
    action: pass
    interface: openvpn
    ipprotocol: inet
    protocol: any
    source: "{{ vpn_site1_admin }}"
    destination: any
    state: present

# ============================================================
# Kill Switch anti-fuite VPN (automatique, permanent) — miroir du Site 1
# Empeche toute fuite du trafic vers le Site 1 par le WAN si le tunnel tombe.
# Regle FLOTTANTE en SORTIE (direction: out) + quick : elle n'intercepte le
# trafic vers les reseaux du Site 1 que s'il tente d'egress par le WAN, ce qui
# n'arrive QUE tunnel down (route via openvpn disparue).
#   Tunnel UP   -> trafic par l'interface openvpn : non bloque.
#   Tunnel DOWN -> droppe au lieu de fuiter en clair sur internet.
# ============================================================

- name: Kill Switch - Block leak of Site 1 LAN over WAN
  pfsensible.core.pfsense_rule:
    name: "KILL-SWITCH Site1 LAN"
    action: block
    floating: true
    direction: out
    quick: true
    interface: WAN
    ipprotocol: inet
    protocol: any
    source: any
    destination: "{{ vpn_site1_lan }}"
    state: present

- name: Kill Switch - Block leak of Site 1 Admin over WAN
  pfsensible.core.pfsense_rule:
    name: "KILL-SWITCH Site1 Admin"
    action: block
    floating: true
    direction: out
    quick: true
    interface: WAN
    ipprotocol: inet
    protocol: any
    source: any
    destination: "{{ vpn_site1_admin }}"
    state: present
