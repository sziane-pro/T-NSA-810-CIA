- name: Install OpenSearch Dashboards
  ansible.builtin.apt:
    name: "{{ opensearch_dashboards_package }}"
    state: present
    update_cache: yes

- name: Deploy the opensearch_dashboards.yml configuration
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: /etc/opensearch-dashboards/opensearch_dashboards.yml
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: '0640'
  notify: Restart OpenSearch Dashboards

- name: Ensure the service is enabled and started
  ansible.builtin.systemd:
    name: opensearch-dashboards
    state: started
    enabled: yes