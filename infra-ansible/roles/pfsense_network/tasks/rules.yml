# Règles WAN

- name: Allow HTTPS to firewall from Epitech
  pfsensible.core.pfsense_rule:
    name: "Allow HTTPS firewall 163.5.3.84"
    action: pass
    interface: WAN
    ipprotocol: inet
    protocol: tcp
    source: "{{ epitech_network_ip }}"
    destination: "(self)"
    destination_port: "443"
    state: present

- name: Allow SSH to firewall from Epitech
  pfsensible.core.pfsense_rule:
    name: "Allow SSH firewall 163.5.3.84"
    action: pass
    interface: WAN
    ipprotocol: inet
    protocol: tcp
    source: "{{ epitech_network_ip }}"
    destination: "(self)"
    destination_port: "22"
    state: present

- name: Pc Jojo to Vm1 SSH
  pfsensible.core.pfsense_rule:
    name: "Pc Jojo => Vm1"
    action: pass
    interface: WAN
    ipprotocol: inet
    protocol: tcp
    source: "{{ epitech_network_ip }}"
    destination: "{{ lan_vm_ip }}"
    destination_port: "22"
    state: present

- name: Reseau Epitech to admin_vm SSH
  pfsensible.core.pfsense_rule:
    name: "Reseau Epitech => Vm1"
    action: pass
    interface: WAN
    ipprotocol: inet
    protocol: tcp
    source: "{{ epitech_network_ip }}"
    destination: "{{ admin_vm_ip }}"
    destination_port: "22"
    state: present

- name: Chez Jaures HTTPS to firewall
  pfsensible.core.pfsense_rule:
