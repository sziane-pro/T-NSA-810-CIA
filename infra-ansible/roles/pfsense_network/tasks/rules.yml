    state: present

- name: Reseau Jaures to Vm1 SSH
  pfsensible.core.pfsense_rule:
    name: "Réseau Jaures => Vm1"
    action: pass
    interface: WAN
    ipprotocol: inet
    protocol: tcp
    source: "{{ jaures_network_ip }}"
    destination: "{{ lan_vm_ip }}"
