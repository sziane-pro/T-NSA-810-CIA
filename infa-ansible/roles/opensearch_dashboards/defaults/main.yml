---
# Version et paquets
opensearch_dashboards_package: "opensearch-dashboards"

# Configuration réseau de la VM locale (Site 2)
opensearch_dashboards_host: "0.0.0.0"
opensearch_dashboards_port: 5601

# Connexion vers le cluster OpenSearch (Site 1)
opensearch_host: "192.168.10.101"
opensearch_port: 9200
opensearch_hosts: "https://{{ opensearch_host }}:{{ opensearch_port }}"

# Identifiants (à surcharger via ton coffre de secrets ou Vault)
opensearch_dashboards_user: "admin"
opensearch_dashboards_password: "{{ opensearch_password }}"