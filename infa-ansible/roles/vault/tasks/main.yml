- name: Install dependencies
  ansible.builtin.apt:
    name:
      - gpg
      - curl
    state: present
    update_cache: true

- name: Add HashiCorp GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

- name: Add HashiCorp repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    state: present

- name: Install Vault
  ansible.builtin.apt:
    name: vault
    state: present
    update_cache: true

- name: Create TLS directory
  ansible.builtin.file:
    path: /opt/vault/tls
    state: directory
    owner: vault
    group: vault
    mode: '0750'

- name: Generate self-signed TLS certificate for Vault
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /opt/vault/tls/vault.key
      -out /opt/vault/tls/vault.crt
      -subj "/CN={{ vault_listen_address }}"
      -addext "subjectAltName=IP:{{ vault_listen_address }}"
    creates: /opt/vault/tls/vault.crt

- name: Set TLS files ownership
  ansible.builtin.file:
    path: "{{ item }}"
    owner: vault
    group: vault
    mode: '0640'
  loop:
    - /opt/vault/tls/vault.crt
    - /opt/vault/tls/vault.key

- name: Deploy Vault configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: vault
    group: vault
    mode: '0640'
  notify: restart vault

- name: Enable and start Vault
  ansible.builtin.systemd:
    name: vault
    enabled: true
    state: started

- import_tasks: init.yml
